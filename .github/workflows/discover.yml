name: Find company job boards

# discover_ats.py finds the job boards of companies on the hiring systems small and mid-size companies use (Workable, Recruitee,
# SmartRecruiters, Teamtailor, Personio, BambooHR, Breezy, Pinpoint, Rippling, Lever Europe, and Greenhouse/Lever/Ashby boards not
# read yet) and writes sources_ats.json; collect.py reads those boards in turns (ATS_TIERS: every 6 to 12 hours by size). It runs here, not on a cloud machine, because
# Workable answers "too many requests" to shared cloud addresses. Runs every day, when the script changes, and by hand.
on:
  push:
    branches: [main]
    paths: [discover_ats.py, .github/workflows/discover.yml]
  schedule:
    - cron: "41 1 * * *"      # every day 01:41 UTC, away from the :17 hourly run: new boards only; on Mondays every board is judged again
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find boards
        run: |
          # new boards every day; on Mondays (and when started by hand or by a change to the script) every board is asked again
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            python3 discover_ats.py --crawls 3 --workers 24 --samples --new-only
          else
            python3 discover_ats.py --crawls 3 --workers 24 --samples
          fi
      - name: Check the feeds still read the saved samples
        run: python3 feeds_test.py
      - name: Commit the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources_ats.json sources_ats_report.json feeds_samples/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          msg=$(python3 -c "import json; r = json.load(open('sources_ats_report.json')); print(f\"Company boards on more hiring systems: {r['boards']:,} boards, {r['jobs']:,} jobs\")")
          git commit -q -m "$msg"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi
            sleep $((i * 20))
          done
          exit 1
