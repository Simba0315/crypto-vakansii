name: Update jobs and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The jobs database (with the archive of closed jobs) lives on a separate one-commit branch,
      # so the main branch does not grow by tens of megabytes every day.
      - name: Restore jobs database
        run: |
          mkdir -p data
          # The data branch holds the only copy of the archive. "It does not exist yet" and "it could not be reached" must not
          # be confused: starting empty after a network error would overwrite everything a few steps later.
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:jobs.json.gz | gunzip > data/jobs.json
            git show FETCH_HEAD:reports.json > data/reports.json 2>/dev/null || rm -f data/reports.json
            echo "restored $(wc -c < data/jobs.json) bytes"
            echo "PREV_BYTES=$(wc -c < data/jobs.json | tr -d ' ')" >> "$GITHUB_ENV"
          else
            code=$?
            if [ "$code" != "2" ]; then echo "could not reach the repository (exit $code): stopping instead of starting empty"; exit 1; fi
            echo "no data branch yet, starting empty"
          fi
      - name: Collect jobs (closed ones move to the archive)
        run: python3 collect.py
      - name: Save jobs database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(wc -c < data/jobs.json | tr -d ' ')
          if [ -n "${PREV_BYTES:-}" ] && [ "$new" -lt $((PREV_BYTES / 2)) ]; then
            echo "the new database ($new bytes) is less than half of the previous one ($PREV_BYTES bytes): not saving it"; exit 1
          fi
          tmp="$(mktemp -d)"
          gzip -9 -c data/jobs.json > "$tmp/jobs.json.gz"
          [ -s data/reports.json ] && cp data/reports.json "$tmp/reports.json"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jobs database"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: Build site
        run: python3 build.py
      # The build adds this month's figures to data/reports.json; past months in it must never be lost, so it is saved again.
      - name: Save monthly report snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp="$(mktemp -d)"
          gzip -9 -c data/jobs.json > "$tmp/jobs.json.gz"
          cp data/reports.json "$tmp/reports.json"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jobs database and monthly reports"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: Check the site fits the hosting limit
        run: |
          mb=$(du -sm site | cut -f1); echo "site is ${mb} MB (the Pages limit is 1024)"
          if [ "$mb" -gt 990 ]; then echo "the site no longer fits the hosting limit"; exit 1; fi
      - name: Check pages against the page standard
        continue-on-error: true
        run: python3 check.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # IndexNow: tells Bing (and the AI assistants that search through it) which pages are new or changed today.
      - name: Tell search engines which pages changed
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -s data/indexnow.json ]; then
            curl -s -o /dev/null -w "IndexNow answered %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" --data-binary @data/indexnow.json
          fi
