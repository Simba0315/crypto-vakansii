name: Update jobs and deploy site

on:
  push:
    branches: [main]
  # Every hour at 17 minutes past (UTC): a job an employer has just published is picked up by the next run.
  # A whole run took 9 to 15 minutes when this was set (15 runs measured on 2026-11-13; reading the feeds is 7 to 13 of them),
  # so hourly runs do not pile up. The same schedule is stated on the site's /status/ page (build.py): change the two together.
  # It is written as two lines on purpose: the 03:17 run is also the once-a-day run, see DAILY below.
  schedule:
    - cron: "17 3 * * *"          # 03:17 UTC: the hourly work plus the once-a-day work
    - cron: "17 0-2,4-23 * * *"   # every other hour: collect, build, deploy
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # "true" only in the run started by the 03:17 line of the schedule above, or by hand. Steps that must not happen 24 times a day
      # are guarded with it. The check is on which schedule line fired, not on the clock: GitHub often starts a scheduled run late,
      # and a run that waited past 04:00 must still count as the 03:17 one. The text here must match that cron line exactly.
      DAILY: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *' }}
      # Our own server (HOSTING.md): once the secret HRN_SERVER (its address) is set, the build also writes the job records
      # (data/jobs.db) next to the pages, and "Upload to our server" sends both there. Until then nothing changes. The address is
      # a secret, not a variable, so it never shows in the public logs: behind Cloudflare it is meant to stay unknown.
      HRN_SERVER_ON: ${{ secrets.HRN_SERVER != '' }}
      HRN_RECORDS: ${{ secrets.HRN_SERVER != '' && 'both' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The jobs database (with the archive of closed jobs) lives on a separate one-commit branch,
      # so the main branch does not grow by tens of megabytes every day.
      - name: Restore jobs database
        run: |
          mkdir -p data
          # The data branch holds the only copy of the archive. "It does not exist yet" and "it could not be reached" must not
          # be confused: starting empty after a network error would overwrite everything a few steps later.
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:jobs.json.gz | gunzip > data/jobs.json
            git show FETCH_HEAD:reports.json > data/reports.json 2>/dev/null || rm -f data/reports.json
            git show FETCH_HEAD:posted.json > data/posted.json 2>/dev/null || rm -f data/posted.json      # what post.py already sent to the channels
            echo "restored $(wc -c < data/jobs.json) bytes"
            echo "PREV_BYTES=$(wc -c < data/jobs.json | tr -d ' ')" >> "$GITHUB_ENV"
          else
            code=$?
            if [ "$code" != "2" ]; then echo "could not reach the repository (exit $code): stopping instead of starting empty"; exit 1; fi
            echo "no data branch yet, starting empty"
          fi
      - name: Collect jobs (closed ones move to the archive)
        run: python3 collect.py
      - name: Save jobs database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(wc -c < data/jobs.json | tr -d ' ')
          if [ -n "${PREV_BYTES:-}" ] && [ "$new" -lt $((PREV_BYTES / 2)) ]; then
            echo "the new database ($new bytes) is less than half of the previous one ($PREV_BYTES bytes): not saving it"; exit 1
          fi
          tmp="$(mktemp -d)"
          gzip -9 -c data/jobs.json > "$tmp/jobs.json.gz"
          [ -s data/reports.json ] && cp data/reports.json "$tmp/reports.json"
          [ -s data/posted.json ] && cp data/posted.json "$tmp/posted.json"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jobs database"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: Build site
        run: python3 build.py
      # The build adds this month's figures to data/reports.json; past months in it must never be lost, so it is saved again.
      # Once a day (DAILY) is enough: the snapshot is one set of figures per month, and saving it means pushing the whole jobs
      # database a second time. In the other runs the file restored at the start is carried over unchanged by "Save jobs database".
      - name: Save monthly report snapshots
        if: env.DAILY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tmp="$(mktemp -d)"
          gzip -9 -c data/jobs.json > "$tmp/jobs.json.gz"
          cp data/reports.json "$tmp/reports.json"
          [ -s data/posted.json ] && cp data/posted.json "$tmp/posted.json"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jobs database and monthly reports"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
      - name: Check the site fits the hosting limit
        run: |
          # bytes of content, not disk blocks: with 40,000 small folders "du" overstates the size by a third
          mb=$(find site -type f -printf '%s\n' | awk '{s+=$1} END {print int(s/1048576)}'); echo "site is ${mb} MB of content (the Pages limit is 1024)"
          # Too large: build again with one page per list (the search shows the rest) rather than stop updating the site.
          if [ "$mb" -gt 940 ]; then
            echo "too large, building again with one page per list"
            HRN_PAGE_CAP=1 python3 build.py
            mb=$(find site -type f -printf '%s\n' | awk '{s+=$1} END {print int(s/1048576)}'); echo "site is now ${mb} MB of content"
          fi
          if [ "$mb" -gt 950 ]; then echo "the site no longer fits the hosting limit"; exit 1; fi
      - name: Check pages against the page standard
        continue-on-error: true
        run: python3 check.py
      # The upload to our own server: the files (without the 42,000 job pages, which the server builds from the records), the records
      # and the page code. HRN_DEPLOY_KEY is a key made for this only; on the server it can do nothing but rsync into /srv/hrn/app.
      # --delay-updates puts every new file in place at the end, so no visitor sees half an upload.
      # continue-on-error: an upload that fails must not stop the GitHub Pages deploy below.
      - name: Upload to our server
        if: env.HRN_SERVER_ON == 'true'
        continue-on-error: true
        env:
          KEY: ${{ secrets.HRN_DEPLOY_KEY }}
          HOST: ${{ secrets.HRN_SERVER }}
          HOSTKEY: ${{ secrets.HRN_SERVER_HOSTKEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/hrn_key"
          if [ -n "$HOSTKEY" ]; then printf '%s\n' "$HOSTKEY" > "$RUNNER_TEMP/hrn_known"; chk="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/hrn_known"; else chk="-o StrictHostKeyChecking=accept-new"; fi
          rsync -az --delete --delay-updates -e "ssh -i $RUNNER_TEMP/hrn_key $chk" \
            --exclude='/site/job/' --include='/site/***' --include='/data/' --include='/data/jobs.db' \
            --include='/*.py' --include='/*.json' --include='/assets/***' --exclude='*' ./ "hrn@$HOST:/"
          rm -f "$RUNNER_TEMP/hrn_key" "$RUNNER_TEMP/hrn_known"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # IndexNow: tells Bing (and the AI assistants that search through it) which pages are new or changed.
      # Once a day (DAILY): sending the same addresses every hour is what IndexNow asks sites not to do. The list from build.py
      # holds the jobs first seen or closed yesterday and today, so nothing found between two daily runs is left out.
      - name: Tell search engines which pages changed
        if: env.DAILY == 'true' && steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -s data/indexnow.json ]; then
            curl -s -o /dev/null -w "IndexNow answered %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" --data-binary @data/indexnow.json
          fi
      # The owner's own channels (Telegram, X): post.py sends the jobs first seen today. It runs only when channels.json lists a
      # channel, after the deploy, so that the link in a post opens. A channel whose secret is missing is skipped; a failed post
      # never fails the run. The owner adds the secrets himself in the repository settings (see CHANNELS.md).
      - name: Are there channels to post to
        id: channels
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          f = pathlib.Path("channels.json")
          c = json.loads(f.read_text()) if f.exists() else {}
          print("any=" + ("true" if c.get("telegram") or (c.get("x") or {}).get("enabled") else "false"))
          PY
      - name: Post new jobs to the channels
        if: steps.channels.outputs.any == 'true' && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 post.py
          # keep the record of what was posted next to the jobs database, or the next run would post the same jobs again
          tmp="$(mktemp -d)"
          gzip -9 -c data/jobs.json > "$tmp/jobs.json.gz"
          [ -s data/reports.json ] && cp data/reports.json "$tmp/reports.json"
          [ -s data/posted.json ] && cp data/posted.json "$tmp/posted.json"
          cd "$tmp"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jobs database"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
