name: Tell Google about new jobs
# Google's Indexing API, every hour, on its own (27 Nov 2026). Until then the notifications went only with the collecting runs of
# update.yml, after a successful upload: a run takes 1.5 to 3.5 hours, every push cancels the run waiting, and about 5 runs a day got
# that far, so Google heard of 20 to 100 jobs a day of the 200 its quota allows (380 in the week of 20 to 26 Nov). This workflow needs
# no build: it reads the newest jobs of the live site (live.py publishes a job within minutes of finding it), opens each page (200,
# its own canonical, valid JobPosting markup), and sends this hour's part of the day's 200, about 8 or 9 (indexing.py --live).
# What was sent is one record shared with update.yml's own step, kept in the Actions cache: an address is never sent twice in 30 days,
# and update.yml sends only when this workflow has not run for two hours.
# Two starts an hour: GitHub skips or delays many scheduled starts (the first one after this workflow was added, 00:53 UTC on 27 Nov,
# never came). Each start sends what is due by then of the day's 200, spread evenly, less what was sent (indexing.hourly_share): the
# second start of an hour sends the few that came due since the first, one after skipped hours makes them up, up to 50.

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write      # to start the next run when this one ends (the chain below)

# one at a time, so two runs never start from the same record and send the same addresses
concurrency:
  group: google-indexing
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # 27 Nov 2026: in 4 hours GitHub started not one of the scheduled runs above (update.yml's own hourly schedule also fires only
    # every 3-4 hours on this repository). So one run now lives up to about 5.5 hours: every 30 minutes it sends what is due of the
    # day's quota, saves the record, and at the end starts the next run itself. The schedule stays as a second way in; a run that
    # starts while another lives waits in the queue (concurrency above), and update.yml restarts the chain after each deploy.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /indexing.py
            /jobsdb.py
            /config.json
          sparse-checkout-cone-mode: false
      - name: Restore what was sent
        uses: actions/cache/restore@v4
        with:
          path: data/indexing_sent.json
          key: indexing-sent-${{ github.run_id }}
          restore-keys: indexing-sent-
      - name: Tell Google about the newest jobs, every 30 minutes for about 5.5 hours
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
          # Google's daily quota; unset means its default, 200. Set the repository variable when Google grants more.
          HRN_INDEXING_DAILY: ${{ vars.HRN_INDEXING_DAILY }}
        run: |
          for i in $(seq 1 11); do
            echo "== round $i, $(date -u +%H:%M) UTC"
            python3 indexing.py --live || echo "round $i failed; the next round tries again"
            [ "$i" -lt 11 ] && sleep 1800
          done
      - name: Keep what was sent
        if: always() && hashFiles('data/indexing_sent.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/indexing_sent.json
          key: indexing-sent-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Start the next run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run indexing.yml --repo "${{ github.repository }}" --ref main || echo "could not start the next run"
