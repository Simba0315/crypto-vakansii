# Hiring Right Now on the Hostinger server: its own server block, next to hypestkey's; nothing of hypestkey's is changed.
# The files come from /srv/hrn/app/site; a job page (/job/...) comes from serve.py, which builds it from the job's record,
# and nginx keeps each one for 5 minutes, so a busy page is built once per 5 minutes however many people open it.
# DOMAIN is replaced by setup.sh.

proxy_cache_path /var/cache/nginx/hrn levels=1:2 keys_zone=hrn:50m max_size=2g inactive=2h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=hrn_jobs:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://DOMAIN$request_uri; }
}

server {
    listen 443 ssl http2;                # nginx 1.24 on the server: "http2 on;" only exists from 1.25.1
    listen [::]:443 ssl http2;
    server_name DOMAIN www.DOMAIN;
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    if ($host = www.DOMAIN) { return 301 https://DOMAIN$request_uri; }
    include /etc/nginx/snippets/hrn-cloudflare.conf;      # the visitor's own address when the site is behind Cloudflare (setup.sh)

    root /srv/hrn/app/site;
    index index.html;
    error_page 404 /404.html;
    access_log /var/log/nginx/hrn.access.log;
    error_log /var/log/nginx/hrn.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain application/rss+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /job/ {
        limit_req zone=hrn_jobs burst=60 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_cache hrn;
        proxy_cache_valid 200 301 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;   # while serve.py restarts, the kept copy is served
        proxy_cache_background_update on;
        proxy_cache_lock on;                # no add_header here: it would drop the server's security headers on job pages
    }
    location = /api/search {                 # word search over the records (records.py), answers kept 2 minutes
        limit_req zone=hrn_jobs burst=60 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_cache hrn;
        proxy_cache_valid 200 2m;
    }
    location = /mcp {                        # the connector for AI assistants: JSON-RPC over POST, nothing kept
        limit_req zone=hrn_jobs burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
    }
    location ~* \.(?:css|js|woff2|png|jpg|webp|svg|ico)$ {
        expires 30d;                       # the pages link to them with ?v=<version>, so a new version is a new address
        try_files $uri =404;
    }
    location ~* \.(?:json|xml|txt|csv)$ {
        expires 10m;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
