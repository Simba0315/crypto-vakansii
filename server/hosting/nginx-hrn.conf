# Hiring Right Now on the Hostinger server: its own server block, next to hypestkey's; nothing of hypestkey's is changed.
# The files come from /srv/hrn/app/site; a job page (/job/...) comes from serve.py, which builds it from the job's record,
# and nginx keeps each one for 5 minutes, so a busy page is built once per 5 minutes however many people open it.
# DOMAIN is replaced by setup.sh.

proxy_cache_path /var/cache/nginx/hrn levels=1:2 keys_zone=hrn:50m max_size=2g inactive=2h use_temp_path=off;
limit_req_zone $binary_remote_addr zone=hrn_jobs:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hrn_api:10m rate=10r/s;     # the API (nginx-hrn-api.conf), once it is installed
# This site shares the server and its nginx with hypestkey. On 26 Nov 2026 serve.py stopped keeping up, nginx held ~1,300 half-open
# connections to it, ran out of connections, and hypestkey's TLS handshakes failed (Cloudflare 525). So a slow backend here must fail
# fast instead of piling up: at most 32 requests reach serve.py at once and 64 the API (more get 502 at once, or the kept copy of the
# page), a backend has 2 s to accept and 15 s to answer, a failed request is not retried, and the site as a whole holds at most 300
# connections (limit_conn below). With one server in an upstream nginx never marks it down: only the extra requests are refused.
upstream hrn_site { zone hrn_site 64k; server 127.0.0.1:8790 max_conns=32; }      # the zone makes the cap one count for all nginx workers, not one per worker
upstream hrn_api { zone hrn_api_up 64k; server 127.0.0.1:8787 max_conns=64; }
limit_conn_zone $server_name zone=hrn_conn:1m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://DOMAIN$request_uri; }
}

server {
    listen 443 ssl http2;                # nginx 1.24 on the server: "http2 on;" only exists from 1.25.1
    listen [::]:443 ssl http2;
    server_name DOMAIN www.DOMAIN;
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    if ($host = www.DOMAIN) { return 301 https://DOMAIN$request_uri; }
    include /etc/nginx/snippets/hrn-cloudflare.conf;      # the visitor's own address when the site is behind Cloudflare (setup.sh)

    root /srv/hrn/app/site;
    index index.html;
    error_page 404 /404.html;
    access_log /var/log/nginx/hrn.access.log combined buffer=64k flush=1m;      # written in batches; files (css, js, images) are not logged at all
    error_log /var/log/nginx/hrn.error.log error;
    limit_conn hrn_conn 300;                  # the whole site: past this, 503 for this site only, never a shortage for the other site on this nginx
    limit_conn_status 503;
    proxy_connect_timeout 2s;                 # for every proxied address below: a backend that does not accept in 2 s or answer in 15 s is given up on
    proxy_read_timeout 15s;
    proxy_next_upstream off;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain application/rss+xml;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /job/ {
        limit_req zone=hrn_jobs burst=60 nodelay;
        proxy_pass http://hrn_site;
        proxy_set_header Host $host;
        proxy_cache hrn;
        proxy_cache_valid 200 301 5m;
        proxy_cache_valid 404 1m;
        # A kept copy is served only while serve.py cannot answer (a restart, an error). It used to be served on "updating" too, with
        # the refresh done in the background: a job page that is opened rarely then always showed the copy from the visit before,
        # up to two hours old, with the scripts of an older build (found on 18 Nov 2026: the page of a job showed the old share
        # row after an update). Now a copy older than five minutes is rendered again before it is sent; that takes milliseconds.
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;                # no add_header here: it would drop the server's security headers on job pages
    }
    location = /api/search {                 # word search over the records (records.py), answers kept 2 minutes
        limit_req zone=hrn_jobs burst=60 nodelay;
        proxy_pass http://hrn_site;
        proxy_set_header Host $host;
        proxy_cache hrn;
        proxy_cache_valid 200 2m;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_cache_lock on;
    }
    # the words people search ("customer service jobs") onto the category the site files them under
    location = /jobs/customer-service/ { return 301 /jobs/support/; }
    location = /jobs/customer-support/ { return 301 /jobs/support/; }
    # where people and AI assistants guess a site's search is (/search?q=...): ours is /jobs/?q=...
    location = /search { return 301 /jobs/$is_args$args; }
    location = /search/ { return 301 /jobs/$is_args$args; }
    location = /api/latest {                 # the newest open jobs, those live.py found since the last upload first; kept 20 seconds
        limit_req zone=hrn_jobs burst=60 nodelay;
        proxy_pass http://hrn_site;
        proxy_set_header Host $host;
        proxy_cache hrn;
        proxy_cache_valid 200 20s;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;      # every open tab asks once a minute: one request goes through, the rest get the copy
        proxy_cache_lock on;
        access_log off;
    }
    location = /api/check-duplicate {        # is this job already on the site? (dedupe.py) answered from memory, nothing kept
        limit_req zone=hrn_jobs burst=60 nodelay;
        proxy_pass http://hrn_site;
        proxy_set_header Host $host;
    }
    location = /mcp {                        # the connector for AI assistants: JSON-RPC over POST, nothing kept
        limit_req zone=hrn_jobs burst=20 nodelay;
        client_max_body_size 720k;
        proxy_pass http://hrn_site;
        proxy_set_header Host $host;
    }
    include /etc/nginx/snippets/hrn-api*.conf;   # the API's addresses (api-setup.sh); before the file rules below, or /api/public/export.json would be looked for as a file
    location = /sw.js { expires 5m; }    # the service worker is not a versioned file: a month in a cache meant no browser got a new one
    location ~* \.(?:css|js|woff2|png|jpg|webp|svg|ico)$ {
        access_log off;
        expires 30d;                       # the pages link to them with ?v=<version>, so a new version is a new address
        try_files $uri =404;
    }
    # The free jobs API and feeds (/api/): any web page may read them (CORS), as the API page promises. Owner's go-ahead, 21 Nov 2026.
    # The security headers are repeated: an add_header here replaces the server's own ones for these addresses.
    location ^~ /api/v1/ {
        expires 10m;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location ^~ /feeds/ {
        expires 10m;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }
    location = /api/openapi.json {
        expires 10m;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }
    location ~* \.(?:json|xml|txt|csv)$ {
        expires 10m;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
