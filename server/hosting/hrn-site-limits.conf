# /etc/systemd/system/hrn-site.service.d/limits.conf (installed 27 Nov 2026 with the owner's yes).
# On 26 Nov serve.py reached its 1,024 open files and the 1G memory limit under a crawler; nginx.conf also got
# worker_connections 4096 (was 768) and worker_rlimit_nofile 16384 the same day.
[Service]
LimitNOFILE=65536
MemoryMax=1536M
