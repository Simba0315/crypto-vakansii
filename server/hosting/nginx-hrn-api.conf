# The API (server/prod.mjs on 127.0.0.1:8787): only its own dynamic addresses. Included inside the site's server block by
# nginx-hrn.conf ("include /etc/nginx/snippets/hrn-api*.conf;"), before the locations for .json and other files, so that
# /api/public/export.json reaches the API. Everything else under /api/ stays as it was: /api/ (the page about the free API),
# /api/v1/*.json and /api/openapi.json are files, /api/search and /api/check-duplicate are answered by serve.py.
location ~ ^/api/(?:health|auth|me|jobs|orders|placements|domain|ai|sync|admin|report|webhooks|public|alerts|claims)(?:/|$) {
    limit_req zone=hrn_api burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 720k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP $remote_addr;    # the visitor's own address (set_real_ip in hrn-cloudflare.conf); whatever the visitor sent in it is replaced
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 75s;                            # the AI tools of Plus wait up to 60 s for an answer
    proxy_buffering off;
}
